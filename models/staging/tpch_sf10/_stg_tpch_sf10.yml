
version: 2

models:
  - name: stg_tpch_sf10__customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf10__lineitems
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - line_number

    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: line_number
        data_tests:
          - not_null

      - name: discount_percentage
        description: "Proporción de descuento aplicada a la línea de pedido."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

  - name: stg_tpch_sf10__nations
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf10__orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__customers')
                field: customer_id

      - name: order_date
        description: "Fecha del pedido, igual o posterior al inicio del periodo histórico de referencia."
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'1992-01-01'::date"
                strictly: false

  - name: stg_tpch_sf10__parts
    columns:
      - name: part_id
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf10__partsupps
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - part_id
              - supplier_id

    columns:
      - name: part_id
        data_tests:
          - not_null

      - name: supplier_id
        data_tests:
          - not_null

  - name: stg_tpch_sf10__regions
    columns:
      - name: region_id
        data_tests:
          - unique
          - not_null

  - name: stg_tpch_sf10__suppliers
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null
