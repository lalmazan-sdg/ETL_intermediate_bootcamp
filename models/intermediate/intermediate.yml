version: 2

models:
  - name: int_order_lines
    description: "Detalle de líneas de pedido."
    columns:
      - name: order_line_id
        description: "Clave surrogate compuesta: order_id || '-' || line_number."
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__orders')
                field: order_id
      - name: line_number
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__customers')
                field: customer_id
      - name: net_amount
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: int_part_supplier
    description: "Join entre partes y proveedores con inventario y valoración calculada."
    columns:
      - name: part_supplier_id
        description: "Clave surrogate compuesta: part_id || '-' || supplier_id."
        tests:
          - unique
          - not_null
      - name: part_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__parts')
                field: part_id
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__suppliers')
                field: supplier_id
      - name: inventory_value
        tests:
          - not_null
      - name: price_cost_difference
        tests:
          - not_null

  - name: int_geography
    description: "Jerarquía geográfica."
    columns:
      - name: nation_id
        description: "Clave primaria del país."
        tests:
          - unique
          - not_null
      - name: nation_name
        tests:
          - not_null
      - name: region_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__regions')
                field: region_id
      - name: region_name
        tests:
          - not_null