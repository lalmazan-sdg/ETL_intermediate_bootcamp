version: 2

models:
  - name: int_order_lines
    description: "Detalle de líneas de pedido con métricas económicas, logísticas y claves temporales."
    columns:
      - name: order_line_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__orders')
                field: order_id

      - name: line_number
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_customers')
                field: customer_id

      - name: part_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__parts')
                field: part_id

      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__suppliers')
                field: supplier_id

      - name: order_date_key
        description: "Clave temporal de la fecha del pedido en formato YYYYMMDD."
        data_tests:
          - not_null

      - name: ship_date_key
        description: "Clave temporal de la fecha de envío en formato YYYYMMDD."
        data_tests:
          - not_null

      - name: commit_date_key
        description: "Clave temporal de la fecha comprometida en formato YYYYMMDD."
        data_tests:
          - not_null

      - name: receipt_date_key
        description: "Clave temporal de la fecha de recepción en formato YYYYMMDD."
        data_tests:
          - not_null

      - name: quantity
        data_tests:
          - not_null

      - name: discount_amount
        data_tests:
          - not_null

      - name: net_amount
        data_tests:
          - not_null

      - name: total_amount
        data_tests:
          - not_null

      - name: shipping_lead_days
        description: "Días entre pedido y envío."

      - name: delivery_lead_days
        description: "Días entre pedido y recepción."

      - name: shipping_delay_days
        description: "Días de diferencia respecto a la fecha comprometida."

      - name: is_late_delivery
        data_tests:
          - not_null

      - name: is_returned
        data_tests:
          - not_null

  - name: int_part_supplier
    description: "Relación producto-proveedor con métricas de inventario y rentabilidad potencial."
    columns:
      - name: part_supplier_id
        data_tests:
          - unique
          - not_null

      - name: part_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__parts')
                field: part_id

      - name: supplier_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__suppliers')
                field: supplier_id

      - name: retail_price
        description: "Precio de catálogo del producto utilizado para calcular las métricas potenciales."
        data_tests:
          - not_null

      - name: available_quantity
        data_tests:
          - not_null

      - name: supply_cost
        data_tests:
          - not_null

      - name: inventory_value
        data_tests:
          - not_null

      - name: price_cost_difference
        data_tests:
          - not_null

      - name: potential_revenue
        data_tests:
          - not_null

      - name: potential_gross_profit
        data_tests:
          - not_null

      - name: potential_margin_pct
        description: "Margen bruto potencial porcentual."

      - name: potential_markup_pct
        description: "Recargo potencial porcentual sobre coste."

      - name: is_out_of_stock
        data_tests:
          - not_null

  - name: int_geography
    description: "Jerarquía geográfica de países y regiones."
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null

      - name: nation_name
        data_tests:
          - not_null

      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf10__regions')
                field: region_id

      - name: region_name
        data_tests:
          - not_null

  - name: int_customers
    description: "Clientes enriquecidos con geografía e indicadores de saldo."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: customer_name
        data_tests:
          - not_null

      - name: nation_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_geography')
                field: nation_id

      - name: nation_name
        data_tests:
          - not_null

      - name: region_id
        data_tests:
          - not_null

      - name: region_name
        data_tests:
          - not_null

      - name: account_balance
        data_tests:
          - not_null

      - name: is_negative_balance
        data_tests:
          - not_null

      - name: is_positive_balance
        data_tests:
          - not_null

  - name: int_suppliers
    description: "Proveedores enriquecidos con información geográfica de países y regiones."
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null

      - name: supplier_name
        data_tests:
          - not_null

      - name: nation_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_geography')
                field: nation_id

      - name: nation_name
        data_tests:
          - not_null

      - name: region_id
        data_tests:
          - not_null

      - name: region_name
        data_tests:
          - not_null

      - name: address
        data_tests:
          - not_null

      - name: phone_number
        data_tests:
          - not_null

      - name: account_balance
        data_tests:
          - not_null

      - name: comment
        description: "Comentario descriptivo del proveedor."

  - name: int_date
    description: "Calendario generado a partir de las fechas de pedidos, envíos y recepciones."
    columns:
      - name: date_key
        description: "Identificador único de la fecha en formato YYYYMMDD."
        data_tests:
          - unique
          - not_null

      - name: date_day
        description: "Fecha completa del calendario."
        data_tests:
          - unique
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: day_of_month
        data_tests:
          - not_null

      - name: is_weekend
        data_tests:
          - not_null
