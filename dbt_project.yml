
name: 'ETL_intermediate_bootcamp'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  exclude_packages:
    - elementary

models:
  ETL_intermediate_bootcamp:
    +copy_grants: true

    staging:
      +materialized: table

    intermediate:
      +materialized: view

    marts:
      +materialized: view
      +grants:
        select: ['DBT_ANALYST']

  elementary:
    +schema: elementary
